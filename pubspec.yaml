name: katte
description: 家族の「買っといて」をリアルタイムで共有するアプリ
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_analytics: ^12.5.0
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#3B9C8F"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: "#3B9C8F"

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#3B9C8F"
  image: assets/branding/splash_icon.png
  android_12:
    color: "#3B9C8F"
    image: assets/branding/splash_icon.png
